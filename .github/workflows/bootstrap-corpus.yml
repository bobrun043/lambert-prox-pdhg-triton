name: Bootstrap validated corpus

on:
  push:
    paths:
      - ".github/import/**"
      - ".github/workflows/bootstrap-corpus.yml"

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify archive
        shell: bash
        run: |
          cat .github/import/part_* | base64 --decode > /tmp/corpus.tar.gz
          echo "661466a26b3ee7d901a23977e3a1575fb076a7e20b9996f664c1cf0cd9b33161  /tmp/corpus.tar.gz" | sha256sum -c -
          tar -xzf /tmp/corpus.tar.gz -C .
          rm -rf .github/import
      - name: Commit validated corpus
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Import validated Lambert-Prox corpus"
            git push
          fi
