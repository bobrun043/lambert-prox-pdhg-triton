name: CPU validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  close1:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy scipy mpmath pytest
      - name: Verify repository hashes and T4 attestation
        run: python verify_close1_package.py
      - name: Compile sources
        run: python -m compileall -q .
      - name: Run CLOSE1 CPU validation
        env:
          PYTHONPATH: .
        run: python run_close1_validation.py
      - name: Upload CPU metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: close1-cpu-${{ matrix.python-version }}
          path: close1_cpu_validation_metrics.json
